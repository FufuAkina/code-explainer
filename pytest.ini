[pytest]
# 测试文件路径
testpaths = .

# 测试文件模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest 选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --ignore=venv
    --ignore=async_example

# 标记（markers）
markers =
    asyncio: mark test as an asyncio test

# 覆盖率配置
[coverage:run]
omit =
    venv/*
    test_*.py
    *__pycache__*
